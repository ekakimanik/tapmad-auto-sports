name: Update Tapmad Playlist
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run Script
        env:
          TAPMAD_TOKEN: ${{ secrets.TAPMAD_TOKEN }}
        run: python tapmad_auto.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-updated Tapmad Playlist"
          file_pattern: tapmad_live.m3u
